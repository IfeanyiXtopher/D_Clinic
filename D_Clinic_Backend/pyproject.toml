[project]
name = "followup-ai-backend"
version = "0.1.0"
description = "AI follow-up layer for a hypertension/diabetes program (Simple-compatible)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.3", "mlflow>=2.14", "matplotlib>=3.9", "jupyter"]
llm = ["presidio-analyzer>=2.2.355"]

[tool.setuptools.packages.find]
include = ["app*", "ml*", "llm*", "chatbot*", "reckoner*", "worker*", "scripts*"]

[tool.setuptools.package-data]
llm = ["prompts/*.txt"]
chatbot = ["prompts/*.txt"]
ml = ["registry/registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
